<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <linearGradient id="favCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="favBlueFigure" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B2356" />
    </linearGradient>

    <linearGradient id="favGoldFigure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <linearGradient id="favBlueHands" x1="0%" y1="20%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="30%" stop-color="#1E3A8A" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>

    <linearGradient id="favGoldWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="favSphereGold" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="88%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>

    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>
  </defs>

  <!-- Base Ground Shadow -->
  <ellipse cx="170" cy="312" rx="85" ry="8" fill="#0A1931" opacity="0.25" filter="url(#favDropShadow)" />

  <!-- Radiant Golden Rays behind the Cross -->
  <g fill="url(#favCrossGrad)">
    <polygon points="170,22 167,50 173,50" opacity="0.9" />
    <polygon points="154,28 158,53 163,51" opacity="0.8" />
    <polygon points="186,28 177,51 182,53" opacity="0.8" />
    <polygon points="130,47 153,60 155,55" opacity="0.85" />
    <polygon points="124,68 150,70 150,65" opacity="0.95" />
    <polygon points="130,90 152,80 154,85" opacity="0.8" />
    <polygon points="210,47 185,55 187,60" opacity="0.85" />
    <polygon points="216,68 190,65 190,70" opacity="0.95" />
    <polygon points="210,90 186,85 188,80" opacity="0.8" />
  </g>

  <!-- Golden Radiant Cross -->
  <g fill="url(#favCrossGrad)">
    <rect x="164.5" y="36" width="11" height="74" rx="2.5" />
    <rect x="146" y="54" width="48" height="11" rx="2.5" />
  </g>

  <!-- Outer Golden Flame Wings -->
  <path d="M170,270 C137,266 90,238 64,178 C48,140 54,100 58,88 C60,104 70,144 100,174 C126,200 154,218 170,270 Z"
        fill="url(#favGoldWings)" />
  <path d="M170,270 C200,266 242,242 266,190 C280,158 278,124 274,112 C276,128 272,160 246,190 C222,218 190,238 170,270 Z"
        fill="url(#favGoldWings)" />

  <!-- Left Figure (Royal Blue) -->
  <g>
    <circle cx="128" cy="124" r="16" fill="url(#favBlueFigure)" />
    <path d="M166,244 C156,230 140,208 122,188 C104,168 96,148 108,130 C116,140 128,154 146,168 C160,146 174,120 176,108 C178,120 170,148 158,180 C152,198 160,220 166,244 Z"
          fill="url(#favBlueFigure)" />
  </g>

  <!-- Right Figure (Gold) -->
  <g>
    <circle cx="220" cy="138" r="14.5" fill="url(#favSphereGold)" />
    <path d="M168,246 C178,234 194,214 210,192 C224,172 232,154 222,140 C216,150 204,164 190,176 C184,158 180,140 180,126 C182,138 190,158 198,180 C202,194 190,220 168,246 Z"
          fill="url(#favGoldFigure)" />
  </g>

  <!-- Base Cupped Hands -->
  <g>
    <path d="M170,294 C148,292 104,276 70,234 C42,200 34,160 30,146 C36,166 50,210 88,244 C122,274 154,286 170,294 Z"
          fill="url(#favBlueHands)" />
    <path d="M170,294 C152,288 116,266 90,230 C70,202 68,174 70,164 C76,180 90,210 118,236 C144,260 160,278 170,294 Z"
          fill="url(#favBlueFigure)" opacity="0.9" />

    <path d="M170,294 C192,292 236,276 270,234 C298,200 306,160 310,146 C304,166 290,210 252,244 C218,274 186,286 170,294 Z"
          fill="url(#favBlueHands)" />
    <path d="M170,294 C188,288 224,266 250,230 C270,202 272,174 270,164 C264,180 250,210 222,236 C196,260 180,278 170,294 Z"
          fill="url(#favBlueFigure)" opacity="0.9" />

    <path d="M170,294 C160,282 150,262 154,248 C160,260 166,274 170,294 C174,274 180,260 186,248 C190,262 180,282 170,294 Z"
          fill="url(#favBlueHands)" />
  </g>
</svg>
